name: CI and production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USERNAME:?Missing VPS_USERNAME secret}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY secret}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS secret}"

          VPS_PORT="${VPS_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/root/project/career}"

          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]

          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          {
            echo "Host production-vps"
            echo "  HostName $VPS_HOST"
            echo "  User $VPS_USERNAME"
            echo "  Port $VPS_PORT"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          ssh production-vps bash -se -- "$DEPLOY_PATH" <<'DEPLOY_SCRIPT'
          set -Eeuo pipefail

          DEPLOY_PATH="$1"
          cd "$DEPLOY_PATH"

          MAINTENANCE_ENABLED=0
          restore_application() {
            deploy_status=$?
            trap - EXIT

            if [ "$MAINTENANCE_ENABLED" -eq 1 ]; then
              echo "Deployment is exiting while maintenance mode is enabled; restoring the application."

              if [ -z "$(docker compose ps --status running -q app)" ]; then
                docker compose up -d app || true
              fi

              docker compose exec -T app php artisan up || true
            fi

            exit "$deploy_status"
          }
          trap restore_application EXIT

          test -f docker-compose.yml
          test -f .env.docker

          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main

          docker compose config --quiet
          docker compose build --pull

          if [ -n "$(docker compose ps -q app)" ]; then
            if docker compose exec -T app php artisan down --retry=60; then
              MAINTENANCE_ENABLED=1
            fi
          fi

          docker compose up -d db
          DB_CONTAINER="$(docker compose ps -q db)"
          for attempt in $(seq 1 30); do
            DB_HEALTH="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$DB_CONTAINER")"
            [ "$DB_HEALTH" = "healthy" ] && break
            [ "$attempt" -eq 30 ] && { echo "Database did not become healthy" >&2; exit 1; }
            sleep 2
          done

          # Run only migrations that have not already been applied.
          docker compose run --rm app php artisan migrate --force

          docker compose up -d --remove-orphans app web queue
          docker compose exec -T app php artisan storage:link --force
          docker compose exec -T app php artisan optimize:clear
          docker compose exec -T app php artisan optimize
          docker compose exec -T app php artisan queue:restart
          docker compose exec -T app php artisan up
          MAINTENANCE_ENABLED=0

          # Check the response code through the Nginx container, not only that
          # the web process accepts a connection.
          HTTP_STATUS="$(docker compose exec -T app curl --silent --show-error --location --max-redirs 5 --output /dev/null --write-out '%{http_code}' http://web/)"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Production health check failed: expected HTTP 200, got ${HTTP_STATUS:-no response}." >&2
            docker compose logs --tail=100 app web db >&2 || true
            exit 1
          fi

          docker compose ps
          echo "Deployment completed successfully."
          DEPLOY_SCRIPT
