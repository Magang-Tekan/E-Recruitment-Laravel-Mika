services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - app_storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erecruitment-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/storage/app:ro
    depends_on:
      - app
    networks:
      - erecruitment-network

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rekruitmen_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    env_file:
      - .env.docker
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-rekruitmen_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erecruitment-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env.docker
    volumes:
      - app_storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - erecruitment-network

networks:
  erecruitment-network:
    driver: bridge

volumes:
  db_data:
  app_storage:
